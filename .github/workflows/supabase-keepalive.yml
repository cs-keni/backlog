name: Supabase Keep-Alive

on:
  schedule:
    # Every 4 days at noon UTC — Supabase pauses after 7 days of inactivity
    - cron: '0 12 */4 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://backlog.vercel.app/api/health)
          echo "Health endpoint returned: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check returned $STATUS — Supabase may be paused"
            exit 1
          fi
          echo "Supabase is active"
